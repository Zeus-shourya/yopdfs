<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#541388">
<meta property="og:type" content="website">
<meta property="og:site_name" content="YoPdfs">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site_url}}/assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{desc}}">
<meta name="twitter:image" content="{{site_url}}/assets/img/og.png">
<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/img/icon-192.png">
<link rel="manifest" href="{{root}}manifest.webmanifest">
<script>(function(){try{var t=localStorage.getItem('yp-theme')||'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="{{root}}assets/css/app.css?v={{ver}}">
{{extra_head}}
<script type="application/ld+json">{{jsonld}}</script>
</head>
<body data-root="{{root}}" data-page="{{page}}">
